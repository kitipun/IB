<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ห้องเคส FA — โจทย์เขียนตอบ IPO</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600&family=Noto+Serif+Thai:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#EEF2F6; --sheet:#FFFFFF; --ink:#14213D; --muted:#5B6B82; --rule:#C9D3E0;
  --accent:#E3A21A; --ok:#1F7A4D; --ok-bg:#E3F3EA; --mid:#9A6A00; --mid-bg:#FBF0D6; --bad:#B4372F; --bad-bg:#FBE7E5;
  --sel:#DCE6F5; --navy:#0B2A6B; --field:#FBFCFE;
  --serif:"Noto Serif Thai","Thonburi",Georgia,serif;
  --sans:"IBM Plex Sans Thai","Sarabun","Leelawadee UI",system-ui,sans-serif;
  --hdr:62px;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#0E1726; --sheet:#16233A; --ink:#E6ECF5; --muted:#9FB0C8; --rule:#2A3B57;
    --accent:#F0B43A; --ok:#4CC38A; --ok-bg:#12352A; --mid:#F0B43A; --mid-bg:#3A2E12; --bad:#F07167; --bad-bg:#3A1C22;
    --sel:#22365A; --navy:#9DB8F0; --field:#111C2F;
  }
}
:root[data-theme="dark"]{
  --paper:#0E1726; --sheet:#16233A; --ink:#E6ECF5; --muted:#9FB0C8; --rule:#2A3B57;
  --accent:#F0B43A; --ok:#4CC38A; --ok-bg:#12352A; --mid:#F0B43A; --mid-bg:#3A2E12; --bad:#F07167; --bad-bg:#3A1C22;
  --sel:#22365A; --navy:#9DB8F0; --field:#111C2F;
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%; scroll-padding-top:calc(env(safe-area-inset-top,0px) + var(--hdr) + 8px); -webkit-text-size-adjust:100%}
body{margin:0; background:var(--paper); color:var(--ink); font-family:var(--sans); font-size:16px; line-height:1.72; min-height:100%}
button{font:inherit; color:inherit}
:focus-visible{outline:3px solid var(--accent); outline-offset:2px}
h5{font-family:var(--serif); font-size:1rem; margin:18px 0 6px; color:var(--navy)}
h5:first-child{margin-top:0}

/* Header */
.top{position:sticky; top:0; z-index:20; background:var(--paper); border-bottom:1px solid var(--rule); padding-top:env(safe-area-inset-top,0px); margin-top:calc(-1 * env(safe-area-inset-top,0px))}
.top-in{max-width:1500px; margin:0 auto; height:var(--hdr); padding:0 18px; display:flex; gap:12px; align-items:center}
.menu{display:none; border:1px solid var(--rule); background:var(--sheet); width:40px; height:40px; border-radius:8px; cursor:pointer; flex:none}
.menu svg{display:block; margin:auto}
.brand{min-width:0}
.brand h1{font-family:var(--serif); font-size:1.2rem; margin:0; line-height:1.25; color:var(--navy); white-space:nowrap}
.brand p{margin:0; font-size:.8rem; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.stats{margin-left:auto; display:flex; gap:18px; align-items:center}
.stat{line-height:1.2; text-align:right}
.stat b{font-family:var(--serif); font-size:1.15rem; display:block}
.stat span{font-size:.74rem; color:var(--muted)}
.bar{height:3px; background:var(--rule)}
.bar span{display:block; height:100%; background:var(--accent); transition:width .3s}

.btn{border:1px solid var(--ink); background:transparent; padding:8px 15px; border-radius:7px; cursor:pointer; font-weight:500; font-size:.92rem; line-height:1.3; min-height:40px}
.btn:hover{background:var(--sel)}
.btn.primary{background:var(--ink); color:var(--sheet)}
.btn.primary:hover{opacity:.9; background:var(--ink)}
.btn.ghost{border-color:var(--rule)}
.btn:disabled{opacity:.4; cursor:not-allowed}

/* Layout */
.layout{max-width:1500px; margin:0 auto; padding:20px 18px 60px; display:grid; grid-template-columns:250px minmax(0,1fr) minmax(0,1fr); gap:22px; align-items:start}
.layout.sum{grid-template-columns:250px minmax(0,1fr)}

/* Index */
nav.index{position:sticky; top:calc(var(--hdr) + 22px); max-height:calc(100vh - var(--hdr) - 40px); overflow:auto; padding-right:2px}
.grp{margin-bottom:12px}
.grp h3{font-size:.78rem; font-weight:600; color:var(--muted); margin:0 0 3px 8px}
.grp ol{list-style:none; margin:0; padding:0}
.grp li button{display:flex; width:100%; text-align:left; gap:9px; align-items:baseline; padding:5px 8px; border:0; background:transparent; border-radius:6px; cursor:pointer; font-size:.88rem; line-height:1.45}
.grp li button:hover{background:var(--sel)}
.grp li button[aria-current="true"]{background:var(--sheet); box-shadow:inset 3px 0 0 var(--accent)}
.grp .n{font-variant-numeric:tabular-nums; color:var(--muted); min-width:1.5em; font-size:.8rem}
.grp .s{margin-left:auto; font-size:.74rem; font-weight:600; white-space:nowrap; color:var(--muted)}
.s.done{color:var(--ok)} .s.wrote{color:var(--navy)}
.drawer-head{display:none}
.scrim{display:none}

/* Panels */
.panel{background:var(--sheet); border:1px solid var(--rule); border-radius:6px; padding:28px 30px}
.meta{display:flex; gap:10px; align-items:center; flex-wrap:wrap; font-size:.84rem; color:var(--muted); margin-bottom:4px}
.tag{border:1px solid var(--rule); padding:0 9px; border-radius:20px; font-size:.76rem; color:var(--ink)}
.title{font-family:var(--serif); font-size:1.5rem; line-height:1.4; margin:0 0 16px}
.client{display:grid; grid-template-columns:max-content 1fr; gap:2px 14px; font-size:.9rem; padding:12px 14px; background:var(--paper); border-radius:6px; margin:0 0 18px}
.client dt{color:var(--muted)} .client dd{margin:0; font-weight:500}
.brief p{margin:0 0 12px}
.tbl{overflow-x:auto; margin:10px 0 14px; -webkit-overflow-scrolling:touch}
table{border-collapse:collapse; font-size:.88rem; min-width:100%}
th,td{border-bottom:1px solid var(--rule); padding:6px 10px; text-align:right; white-space:nowrap; vertical-align:top}
th:first-child,td:first-child{text-align:left; white-space:normal; min-width:150px}
thead th{font-weight:600; color:var(--muted); border-bottom:1.5px solid var(--ink)}
ol.plain,ul.plain{margin:0 0 12px; padding-left:1.3em}
ul.plain{list-style:disc}
.tasks{margin-top:22px; padding-top:16px; border-top:1px solid var(--rule)}
.tasks h4{font-family:var(--serif); font-size:1.05rem; margin:0 0 8px}
.tasks ol{margin:0; padding-left:1.4em}
.tasks li{margin-bottom:6px; font-weight:500}
.pager{display:flex; gap:10px; margin-top:22px}
.pager .sp{flex:1}

/* Work column */
.work{position:sticky; top:calc(var(--hdr) + 22px); max-height:calc(100vh - var(--hdr) - 40px); overflow:auto; position:sticky}
.work .panel{position:relative}
.work h4{font-family:var(--serif); font-size:1.1rem; margin:0 0 4px}
.work .sub{font-size:.84rem; color:var(--muted); margin:0 0 12px}
textarea{width:100%; min-height:260px; resize:vertical; border:1px solid var(--rule); border-radius:6px; background:var(--field); color:var(--ink); font:inherit; font-size:.97rem; line-height:1.7; padding:12px 14px}
textarea:focus{outline:2px solid var(--accent); outline-offset:0; border-color:transparent}
.wmeta{display:flex; justify-content:space-between; font-size:.78rem; color:var(--muted); margin:6px 0 14px}
.acts{display:flex; gap:10px; flex-wrap:wrap; align-items:center}
.model{margin-top:22px; padding-top:18px; border-top:2px solid var(--ink)}
.model .lead{font-family:var(--serif); font-size:1.1rem; margin:0 0 10px}
.model ul{margin:0 0 10px; padding-left:1.2em}
.model li{margin-bottom:4px}
.model p{margin:0 0 10px}
.note{font-size:.82rem; color:var(--muted)}
.rubric{margin-top:22px; padding:16px; background:var(--paper); border-radius:6px}
.rubric h4{margin-bottom:2px}
.ritem{padding:10px 0; border-bottom:1px solid var(--rule)}
.ritem:last-of-type{border-bottom:0}
.ritem p{margin:0 0 7px; font-size:.92rem}
.ritem p small{color:var(--muted); margin-left:6px}
.seg{display:inline-flex; border:1px solid var(--rule); border-radius:7px; overflow:hidden; background:var(--sheet)}
.seg button{border:0; background:transparent; padding:6px 13px; cursor:pointer; font-size:.84rem; min-height:36px; border-right:1px solid var(--rule)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"][data-v="0"]{background:var(--bad-bg); color:var(--bad); font-weight:600}
.seg button[aria-pressed="true"][data-v="1"]{background:var(--mid-bg); color:var(--mid); font-weight:600}
.seg button[aria-pressed="true"][data-v="2"]{background:var(--ok-bg); color:var(--ok); font-weight:600}
.total{display:flex; align-items:center; gap:10px; margin-top:12px}
.total b{font-family:var(--serif); font-size:1.6rem}
.total span{font-size:.84rem; color:var(--muted)}

.stamp{margin-left:auto; font-family:var(--serif); font-weight:700; font-size:1.15rem; padding:2px 12px; border:3px double currentColor; border-radius:6px; transform:rotate(-8deg); opacity:.9; pointer-events:none; background:var(--sheet)}
.stamp.hi{color:var(--ok)} .stamp.md{color:var(--mid)} .stamp.lo{color:var(--bad)}
.stamp.fresh{animation:thump .38s cubic-bezier(.2,1.6,.4,1)}
@keyframes thump{0%{transform:rotate(-8deg) scale(2.2); opacity:0}100%{transform:rotate(-8deg) scale(1); opacity:.9}}

/* Summary */
.big{font-family:var(--serif); font-size:3.2rem; font-weight:700; line-height:1.1; margin:4px 0}
.big small{font-size:1.3rem; color:var(--muted); font-weight:600}
.rows{margin:18px 0 24px}
.row{display:grid; grid-template-columns:minmax(120px,200px) 1fr 120px; gap:12px; align-items:center; padding:8px 0; border-bottom:1px solid var(--rule); font-size:.9rem}
.track{height:8px; background:var(--paper); border-radius:4px; overflow:hidden}
.track span{display:block; height:100%; background:var(--ok)}
.row b{text-align:right; font-weight:500; font-size:.84rem; color:var(--muted)}
.clist td button{border:0; background:none; padding:0; color:var(--navy); text-decoration:underline; cursor:pointer; text-align:left; font-size:.9rem}

/* Bottom bar (mobile) */
.bottom{display:none}

@media (prefers-reduced-motion:reduce){.stamp.fresh{animation:none}.bar span{transition:none}.index{transition:none!important}}

/* Tablet: drawer index, two columns */
@media (max-width:1279px){
  .layout{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
  .layout.sum{grid-template-columns:minmax(0,1fr)}
  .menu{display:block}
  nav.index{position:fixed; top:0; bottom:0; left:0; width:min(320px,86vw); max-height:none; z-index:40; background:var(--sheet); border-right:1px solid var(--rule); padding:calc(env(safe-area-inset-top,0px) + 12px) 10px calc(env(safe-area-inset-bottom,0px) + 20px); transform:translateX(-102%); transition:transform .22s ease; visibility:hidden}
  nav.index.open{transform:none; visibility:visible}
  .drawer-head{display:flex; justify-content:space-between; align-items:center; margin:0 0 10px 8px}
  .drawer-head b{font-family:var(--serif)}
  .scrim.open{display:block; position:fixed; inset:0; background:rgba(10,20,40,.4); z-index:30}
}
/* Phone: single column */
@media (max-width:859px){
  :root{--hdr:56px}
  .layout{grid-template-columns:minmax(0,1fr); padding:12px 12px calc(env(safe-area-inset-bottom,0px) + 86px); gap:12px}
  .work{position:static; max-height:none; overflow:visible}
  .panel{padding:20px 16px}
  .title{font-size:1.25rem}
  .brand h1{font-size:1.05rem}
  .brand p{display:none}
  .stat span{display:none}
  .stats{gap:12px}
  #sumBtnTop{display:none}
  .pager{display:none}
  .row{grid-template-columns:1fr 90px; }
  .row .track{grid-column:1 / -1; order:3}
  .bottom{display:flex; position:fixed; left:0; right:0; bottom:0; z-index:15; background:var(--sheet); border-top:1px solid var(--rule); padding:8px 10px calc(env(safe-area-inset-bottom,0px) + 8px); gap:8px}
  .bottom .btn{flex:1; padding:8px 6px; font-size:.88rem}
  .bottom .mid{flex:1.3}
  .seg button{padding:6px 10px}
}
</style>
</head>
<body>
<header class="top">
  <div class="top-in">
    <button class="menu" id="menuBtn" aria-label="เปิดรายการเคส" aria-controls="index" aria-expanded="false">
      <svg width="20" height="20" viewBox="0 0 20 20" aria-hidden="true"><path d="M3 5h14M3 10h14M3 15h14" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
    </button>
    <div class="brand">
      <h1>ห้องเคส FA</h1>
      <p>20 เคสเขียนตอบ: จัดโครงสร้างเพื่อ IPO ขจัด COI ลด RPT</p>
    </div>
    <div class="stats">
      <div class="stat"><b id="stWrote">0/20</b><span>เขียนแล้ว</span></div>
      <div class="stat"><b id="stScore">0</b><span id="stScoreLbl">คะแนน</span></div>
      <button class="btn ghost" id="sumBtnTop" data-sum>สรุปคะแนน</button>
    </div>
  </div>
  <div class="bar"><span id="barFill" style="width:0"></span></div>
</header>

<div class="scrim" id="scrim"></div>
<div class="layout" id="layout">
  <nav class="index" id="index" aria-label="รายการเคส"></nav>
  <section id="colA"></section>
  <section id="colB" class="work"></section>
</div>

<div class="bottom" id="bottom">
  <button class="btn ghost" id="bPrev">ก่อนหน้า</button>
  <button class="btn ghost mid" id="bList">เคส 1/20</button>
  <button class="btn ghost" id="bNext">ถัดไป</button>
</div>

<script>
const TOPICS = {
  screen:"คัดกรองคุณสมบัติ",
  share:"ซื้อหุ้น / แลกหุ้น",
  asset:"ซื้อทรัพย์สิน / เช่า",
  transfer:"โอนกิจการ / ควบรวม",
  group:"จัดโครงสร้างกลุ่ม",
  coi:"COI และ RPT",
  pre:"ผู้ถือหุ้นก่อน IPO",
  ready:"ความพร้อมองค์กร",
  plan:"แผน IPO ครบวงจร"
};

const CASES = [
/* 1 */{topic:"screen", title:"ไทยเคมีภัณฑ์อยากเข้า SET ปีนี้",
client:"บจก. ไทยเคมีภัณฑ์", biz:"ผลิตสารเคมีสำหรับระบบบำบัดน้ำ ขายให้โรงงานอุตสาหกรรม", target:"SET ปี 2569",
brief:`<p>ผู้ถือหุ้นต้องการเข้า SET เพราะอยากได้ภาพลักษณ์ของตลาดใหญ่ ทุนชำระแล้ว 120 ลบ. ส่วนของผู้ถือหุ้น 380 ลบ. คาดว่าระดมทุน IPO ได้ราว 250 ลบ.</p>
<div class="tbl"><table><thead><tr><th>ล้านบาท</th><th>2566</th><th>2567</th><th>2568</th></tr></thead>
<tbody><tr><td>กำไรสุทธิตามงบการเงิน</td><td>48</td><td>52</td><td>79</td></tr></tbody></table></div>
<p>กำไรปี 2568 รวมกำไรจากการขายเงินลงทุนในบริษัทที่ไม่เกี่ยวกับธุรกิจหลัก 6 ลบ. (หลังภาษี) ทีมผู้บริหารเป็นชุดเดิมตั้งแต่ปี 2562 ผู้ก่อตั้งดำรงตำแหน่งทั้งประธานกรรมการและกรรมการผู้จัดการ</p>`,
tasks:["คำนวณกำไรที่ใช้พิจารณา และสรุปว่าผ่าน Profit Test ของ SET และ mai หรือไม่",
"นอกจากเกณฑ์กำไร มีเกณฑ์ใดอีกที่เป็นอุปสรรคต่อการเข้า SET",
"ให้คำแนะนำผู้ถือหุ้นเรื่องการเลือกตลาดและจังหวะเวลา"],
answer:`<h5>1. กำไรที่ใช้พิจารณา</h5>
<p>ตัดกำไรจากการขายเงินลงทุนซึ่งเป็นรายการครั้งเดียวออก กำไรปกติปี 2568 = 79 − 6 = <b>73 ลบ.</b></p>
<ul><li><b>SET:</b> ปีล่าสุด 73 ลบ. ต่ำกว่า 75 ลบ. → ไม่ผ่าน (กำไร 2 ปีรวม 52 + 73 = 125 ลบ. อยู่ที่เส้นพอดี แต่ไม่ช่วยเพราะปีล่าสุดไม่ผ่าน)</li>
<li><b>mai:</b> ปีล่าสุด 73 ลบ. เกิน 25 ลบ. และ 2–3 ปีรวมเกิน 40 ลบ. → ผ่าน ทุนชำระ 120 ลบ. (เกณฑ์ 50) และส่วนผู้ถือหุ้น 380 ลบ. (เกณฑ์ 100) ก็ผ่าน</li></ul>
<h5>2. อุปสรรคอื่น</h5>
<ul><li><b>ส่วนของผู้ถือหุ้นของ SET ต้องเกิน 800 ลบ.</b> หลัง IPO ประมาณ 380 + 250 = 630 ลบ. ยังขาดราว 170 ลบ.</li>
<li><b>ประธานกรรมการกับผู้บริหารสูงสุดต้องไม่ใช่คนเดียวกัน</b> ข้อนี้ต้องแก้ไม่ว่าจะเลือกตลาดใด</li>
<li>Track record และความต่อเนื่องของผู้บริหารผ่านแล้ว</li></ul>
<h5>3. คำแนะนำ</h5>
<p><b>ทางเลือก A — mai ปี 2569:</b> ผ่านเกณฑ์แล้ว เหลือแก้เรื่องธรรมาภิบาล ได้เงินเร็ว และย้ายไป SET ภายหลังได้เมื่อคุณสมบัติครบ</p>
<p><b>ทางเลือก B — รอเข้า SET:</b> ต้องให้กำไรปกติปี 2569 ถึง 75 ลบ. และทำให้ส่วนผู้ถือหุ้นหลัง IPO ถึง 800 ลบ. (ระดมทุนมากขึ้นหรือสะสมกำไร) แลกกับเวลาอย่างน้อย 1 ปีและความเสี่ยงของภาวะตลาด</p>
<p>มุมมอง FA: ถ้าบริษัทต้องการเงินทุนขยายกิจการตอนนี้ mai คุ้มกว่า ภาพลักษณ์ไม่ควรเป็นเหตุผลหลักที่ทำให้เลื่อนการระดมทุน</p>`,
rubric:[["ตัดกำไรจากการขายเงินลงทุนออก ได้กำไรปกติปีล่าสุด 73 ลบ.",2],
["สรุปถูกว่า SET ไม่ผ่าน (ปีล่าสุดต่ำกว่า 75) แต่ mai ผ่าน",2],
["ระบุเกณฑ์ส่วนผู้ถือหุ้น SET 800 ลบ. และชี้ว่ายังไม่ถึง",2],
["ระบุว่าต้องแยกประธานกรรมการกับผู้บริหารสูงสุด",2],
["เสนอทางเลือกตลาดและจังหวะเวลา พร้อมเหตุผลเชิงธุรกิจ",2]]},

/* 2 */{topic:"share", title:"ซอสดีกับบริษัทขนส่งของครอบครัว",
client:"บจก. ซอสดี", biz:"ผลิตซอสปรุงรส", target:"SET",
brief:`<p>บจก. ซอสดีขนส่ง (B) ขนส่งสินค้าให้ บจก. ซอสดี (A) <b>100% ของงานทั้งหมด</b> มีรถ 30 คัน และ<b>ใบอนุญาตประกอบการขนส่งออกในนามบริษัท B</b></p>

<p>ทุนชำระของ B 10 ลบ. (ต้นทุนของผู้ถือหุ้น) มูลค่าตามบัญชี 40 ลบ. FA ประเมินมูลค่ายุติธรรมด้วย DCF ได้ 55–65 ลบ.</p>

tasks:["ทำไมต้องนำ B เข้ากลุ่ม และทำไมการซื้อหุ้นเหมาะกว่าการโอนกิจการหรือซื้อทรัพย์สิน",

answer:`<h5>1. ทำไมต้องเป็นการซื้อหุ้น</h5>
<p>A พึ่งพิง B ทั้งหมด เป็น COI แนวตั้ง ครอบครัวกำหนดค่าขนส่งได้เอง (Transfer Pricing) จึงต้องนำ B เข้ากลุ่ม</p>
<p>ใบอนุญาตขนส่งผูกกับนิติบุคคล B การ<b>ซื้อหุ้น</b>ทำให้ B ยังมีตัวตนเหมือนเดิม ใบอนุญาต สัญญา และพนักงานไม่สะดุด ส่วนการโอนกิจการหรือซื้อทรัพย์สินต้องขอใบอนุญาตใหม่และโอนรถทีละคัน</p>
<h5>2. ราคา</h5>
<ul><li><b>120 ลบ.:</b> สูงกว่ามูลค่ายุติธรรมเกือบเท่าตัว เป็นการถ่ายเทเงินจากบริษัทไปครอบครัวก่อน IPO ทำให้ส่วนผู้ถือหุ้นลดลงและผู้ลงทุนในอนาคตเสียประโยชน์ FA รับไม่ได้</li>
<li><b>10 ลบ.:</b> ต่ำกว่ามูลค่าตามบัญชีมาก แม้บริษัทได้ประโยชน์ แต่ราคาไม่มีเหตุผลรองรับ อาจถูกตั้งคำถามทั้งด้านภาษีและความเป็นธุรกรรมจริง</li>
<li><b>แนะนำ:</b> ราคาในช่วงมูลค่าตามบัญชีถึงมูลค่ายุติธรรม (40–65 ลบ.) โดยมีรายงานประเมินมูลค่ารองรับ และอธิบายเหตุผลการเลือกได้</li></ul>
<h5>3. ภาษีและบัญชี</h5>
<ul><li>ผู้ขายเป็นบุคคลธรรมดา กำไรจากการขายหุ้นเหนือต้นทุน 10 ลบ. เป็นเงินได้ที่ต้องเสียภาษี (เช่น ขาย 40 ลบ. มีกำไร 30 ลบ.)</li>
<li>เป็นการรวมธุรกิจภายใต้การควบคุมเดียวกัน บันทึกตามมูลค่าตามบัญชี ไม่เกิดค่าความนิยม ส่วนต่างระหว่างราคาซื้อกับสินทรัพย์สุทธิของ B บันทึกในส่วนของผู้ถือหุ้น และปรับงบเปรียบเทียบเสมือนรวมกันตั้งแต่ต้น</li></ul>
<h5>4. ขั้นตอน</h5>
<p>รายงานประเมินมูลค่า → มติกรรมการ/ผู้ถือหุ้นของ A → สัญญาซื้อขายหุ้น → <b>ชำระเงินจริงผ่านธนาคาร</b> → ตราสารโอนหุ้นและปรับทะเบียนผู้ถือหุ้น (บอจ.5) → ปรับกรรมการของ B → ทำนโยบายค่าขนส่งภายในกลุ่ม ทุกขั้นเก็บเป็นกระดาษทำการของ FA</p>`,
rubric:[["อธิบาย COI แนวตั้งและความจำเป็นต้องนำ B เข้ากลุ่ม",2],
["ใช้เรื่องใบอนุญาตผูกกับนิติบุคคลอธิบายว่าทำไมซื้อหุ้นดีกว่า",2],
["ปฏิเสธราคา 120 ลบ. และเสนอช่วงราคาที่มีรายงานประเมินรองรับ",2],
["ระบุภาษีเงินได้ของผู้ขายและหลักบัญชีการรวมธุรกิจภายใต้การควบคุมเดียวกัน",2],

"ถ้าไม่ซื้อ ทางเลือกการเช่าต้องมีเงื่อนไขอะไร"],
answer:`<h5>1. ซื้อหุ้น vs ซื้อทรัพย์สิน</h5>
<ul><li><b>ซื้อหุ้น:</b> ได้ทั้งบริษัทรวมถึงห้องชุด ที่ดินเขาใหญ่ เงินกู้ และ<b>ข้อพิพาทภาษี 25 ลบ.</b> ต้องล้างทรัพย์สินที่ไม่เกี่ยวข้องก่อน และรับความเสี่ยงหนี้แฝง</li>
<li><b>ซื้อทรัพย์สิน:</b> เลือกเฉพาะโรงงาน ตัดหนี้สินและความเสี่ยงที่ไม่ต้องการออก (Ring-fence) แต่มีต้นทุนการโอนสูงกว่า</li></ul>
<h5>2. แนะนำซื้อเฉพาะโรงงาน และประมาณต้นทุน</h5>
<ul><li>ค่าธรรมเนียมโอน 2% × ราคาประเมินกรมที่ดิน 150 = 3.0 ลบ.</li>
<li>ภาษีธุรกิจเฉพาะ 3.3% (นิติบุคคลขายอสังหาฯ) × ราคาที่สูงกว่าระหว่างราคาขายกับราคาประเมิน = 3.3% × 180 ≈ 5.94 ลบ. (เมื่อเสียภาษีธุรกิจเฉพาะแล้วไม่ต้องเสียอากรแสตมป์)</li>
<li>ภาษีหัก ณ ที่จ่าย 1% ≈ 1.8 ลบ. เป็นเครดิตภาษีของผู้ขาย</li></ul>
<p>ใครรับภาระส่วนใดต้องตกลงในสัญญาตามเงื่อนไขการค้าทั่วไป ถ้ามีเครื่องจักรรวมด้วยต้องคิด VAT 7%</p>
<h5>3. ประเด็นที่ต้องจัดการ</h5>
<ul><li><b>ราคา:</b> ใช้ผู้ประเมินอิสระในรายชื่อ ก.ล.ต. เป็นราคาตลาด</li>
<li><b>จำนอง:</b> ธนาคารต้องไถ่ถอนพร้อมวันโอน โดยนำเงินค่าขายไปชำระหนี้</li>
<li><b>แหล่งเงิน:</b> ใช้เงินกู้ระยะสั้นก่อน IPO แล้วคืนด้วยเงินระดมทุน (ระบุในวัตถุประสงค์การใช้เงิน) หรือซื้อหลัง IPO แต่จะเป็นรายการเกี่ยวโยงที่ต้องผ่านการอนุมัติตามขนาดรายการ</li>
<li><b>จังหวะ:</b> ทำก่อนยื่นไฟลิ่งดีที่สุด เพื่อให้นักลงทุนเห็นโครงสร้างที่สะอาด กำไรจะเปลี่ยนจากค่าเช่าเป็นค่าเสื่อมราคาและดอกเบี้ย</li></ul>
<h5>4. ถ้าเลือกเช่า</h5>
<p>ทำสัญญาเช่าระยะยาวเป็นหนังสือและจดทะเบียน (เช่าเกิน 3 ปีต้องจดทะเบียนจึงบังคับได้ตลอดอายุ) ค่าเช่าตามตลาด มีสิทธิต่ออายุและอัตราปรับขึ้นที่กำหนดไว้ชัด และให้สิทธิซื้อก่อน (First Right) หากผู้ให้เช่าจะขาย</p>`,
rubric:[["ชี้ว่าการซื้อหุ้นจะรับหนี้แฝง ข้อพิพาทภาษี และทรัพย์สินที่ไม่เกี่ยวข้องมาด้วย",2],

/* 4 */{topic:"share", title:"ปูนไทยเหนือไม่มีเงินสดซื้อบริษัทพี่น้อง",

brief:`<p>ครอบครัวเดียวกันถือหุ้น 100% ในสามบริษัท ทำธุรกิจเดียวกันคนละภาค</p>

<tr><td>B ปูนไทยกลาง</td><td>120</td></tr>
<tr><td>C ปูนไทยใต้</td><td>80</td></tr></tbody></table></div>
<p>A ต้องรวม B และ C เข้ากลุ่ม แต่มีเงินสดน้อย ครอบครัวไม่ต้องการให้ A กู้เงิน</p>`,
tasks:["อธิบายกลไก Share Swap และคำนวณจำนวนหุ้นใหม่ที่ A ต้องออก",
"ผลต่อทุนชำระและการวางขนาด IPO (สมมติผู้ถือหุ้นทั้งหมดเป็น Strategic Shareholder)",

"การบันทึกบัญชี"],
answer:`<h5>1. กลไก Share Swap</h5>
<p>A ออกหุ้นเพิ่มทุนให้ครอบครัว โดยครอบครัวชำระค่าหุ้นด้วยหุ้นของ B และ C แทนเงินสด ทำให้ B และ C เป็นบริษัทย่อย 100% ของ A</p>
<ul><li>มูลค่าต่อหุ้นของ A = 500 ÷ 200 ล้านหุ้น = 2.50 บาท</li>
<li>หุ้นใหม่ = (120 + 80) ÷ 2.50 = <b>80 ล้านหุ้น</b> → ทุนชำระ 280 ลบ.</li></ul>
<h5>2. ผลต่อการวางขนาด IPO</h5>
<p>ทุน 280 ลบ. อยู่ใกล้เส้น 300 ลบ. เมื่อเพิ่มทุน IPO ทุนจะเกิน 300 ลบ. จึงใช้เกณฑ์ Free Float ≥ 25% และเสนอขาย ≥ 15% หรือพาร์ ≥ 60 ลบ.</p>
<ul><li>Free Float มาจากหุ้น IPO ทั้งหมด: X ÷ (280 + X) ≥ 25% → X ≥ 93.33 → อย่างน้อย <b>94 ล้านหุ้น</b> (ทุนหลัง IPO ≈ 374 ลบ.)</li>
<li>ตรวจเกณฑ์เสนอขาย: 94 ÷ 374 ≈ 25% และพาร์ 94 ลบ. เกิน 60 ลบ. → ผ่าน</li></ul>
<p>บทเรียน: การปรับโครงสร้างเปลี่ยนทุนชำระ จึงต้องวางแผนขนาด IPO หลังปรับโครงสร้างเสมอ</p>
<h5>3. ข้อดีข้อเสีย</h5>
<ul><li><b>ข้อดี:</b> ไม่ใช้เงินสด เก็บเงินไว้ขยายธุรกิจ ครอบครัวยังถือหุ้นสัดส่วนเดิมโดยรวม</li>
<li><b>ข้อเสีย:</b> ผู้ถือหุ้นบุคคลอาจมีภาระภาษีจากกำไรการแลกหุ้น (มูลค่าที่ได้รับเกินต้นทุน) ทั้งที่ไม่ได้รับเงินสด อัตราแลกเปลี่ยนขึ้นกับการประเมินมูลค่าทั้งสองฝั่ง จึงต้องมีที่ปรึกษาประเมินอย่างเป็นอิสระ และต้องมีมติผู้ถือหุ้นเรื่องเพิ่มทุนและการชำระค่าหุ้นด้วยทรัพย์สิน</li></ul>
<h5>4. บัญชี</h5>
<p>รวมธุรกิจภายใต้การควบคุมเดียวกัน บันทึก B และ C ตามมูลค่าตามบัญชี ไม่เกิดค่าความนิยม ส่วนต่างบันทึกในส่วนของผู้ถือหุ้น และนำเสนองบเสมือนรวมกันตั้งแต่ต้น ซึ่งช่วยแสดงผลการดำเนินงานต่อเนื่องของกลุ่ม</p>`,
rubric:[["อธิบายกลไก Share Swap ถูกต้อง",2],
["คำนวณหุ้นใหม่ 80 ล้านหุ้น ทุน 280 ลบ.",2],
["เห็นว่าหลัง IPO ทุนข้าม 300 ลบ. และคำนวณ IPO ขั้นต่ำราว 94 ล้านหุ้น",2],
["ระบุภาระภาษีของผู้ถือหุ้นที่ไม่ได้รับเงินสด และความจำเป็นของการประเมินมูลค่า",2],
["บันทึกบัญชีแบบรวมธุรกิจภายใต้การควบคุมเดียวกัน",2]]},

<h5>3. ประเด็นปฏิบัติ</h5>
<ul><li><b>พนักงาน 85 คน:</b> การเปลี่ยนนายจ้างต้องได้รับความยินยอมจากลูกจ้าง และอายุงานกับสิทธิประโยชน์เดิมต้องนับต่อเนื่อง</li>
<li><b>สัญญาตัวแทน 40 ราย:</b> ต้องแปลงคู่สัญญาหรือทำสัญญาใหม่กับ A แจ้งลูกค้าและคู่ค้าล่วงหน้า</li>
<li><b>ผลขาดทุนทางภาษี 8 ลบ.:</b> โดยทั่วไปไม่ตามมากับการโอน ถือเป็นต้นทุนของการปรับโครงสร้างที่ต้องชั่งน้ำหนัก</li>

<p>เป็นการรวมธุรกิจภายใต้การควบคุมเดียวกัน แสดงผลการดำเนินงานรวมเสมือนเป็นหน่วยเดียวกันตลอดช่วงที่ควบคุมร่วม กำไรของกลุ่มที่เคยกระจายอยู่ใน B จะแสดงอยู่ใน A ควรหารือกับตลาดหลักทรัพย์ฯ ล่วงหน้าเรื่องการใช้ผลการดำเนินงานรวมพิจารณาคุณสมบัติ</p>

answer:`<h5>1. ทำไมต้องรวม</h5>

<h5>2. เปรียบเทียบ</h5>

<li><b>Merger (A+B=A):</b> ทำได้ตามการแก้ไขประมวลกฎหมายแพ่งและพาณิชย์ที่มีผลตั้งแต่ปี 2566 ให้ X คงอยู่และรักษาบัตร BOI ได้ แต่สัญญารัฐของ Y ยังต้องจัดการ และน้องชายอาจรู้สึกถูกกลืน</li>
<li><b>Share Swap ภายใต้บริษัทเดียว (หรือ Holding ใหม่):</b> X ออกหุ้นใหม่ให้น้องชายแลกกับหุ้น Y ทั้งหมด ทั้ง X และ Y ยังคงอยู่ บัตร BOI สัญญา และใบอนุญาตไม่ต้องโอน</li></ul>
<p><b>แนะนำ Share Swap</b> เพราะรักษาสิทธิพิเศษของทั้งสองฝั่งได้ หากเรื่องชื่อสำคัญ ให้ตั้ง Holding ใหม่ที่ใช้ชื่อเป็นกลางแล้วแลกหุ้นทั้ง X และ Y เข้าไป</p>

answer:`<h5>1. ลำดับ Corporate Actions</h5>

{ const order=Object.keys(TOPICS); CASES.sort((a,b)=>order.indexOf(a.topic)-order.indexOf(b.topic)); }

const STORE = "fa-case-room-written-v1";
const LV = ["ไม่ได้","บางส่วน","ครบ"];
let S = {ans:{}, rev:{}, grd:{}, cur:0, view:"case"};
let freshStamp = false, saveTimer = null;

function load(){ try{ const s = JSON.parse(localStorage.getItem(STORE)||"null"); if(s){ S.ans=s.ans||{}; S.rev=s.rev||{}; S.grd=s.grd||{}; S.cur=Math.min(Math.max(s.cur|0,0),CASES.length-1);} }catch(e){} }
function save(){ try{ localStorage.setItem(STORE, JSON.stringify({ans:S.ans, rev:S.rev, grd:S.grd, cur:S.cur})); }catch(e){} }
const esc = s => String(s).replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function caseScore(i){
  const g = S.grd[i]; const r = CASES[i].rubric;
  if(!g) return {score:0, graded:false, n:0};
  let sc = 0, n = 0;
  r.forEach((it,k)=>{ if(g[k]!=null){ n++; sc += it[1]*g[k]/2; } });
  return {score:sc, graded:n===r.length, n};
}
function status(i){
  const cs = caseScore(i);
  if(cs.graded) return {cls:"done", txt:cs.score+"/10"};
  if((S.ans[i]||"").trim()) return {cls:"wrote", txt:"เขียนแล้ว"};
  return {cls:"", txt:""};
}
function totals(){
  let wrote=0, graded=0, score=0;
  CASES.forEach((c,i)=>{ if((S.ans[i]||"").trim()) wrote++; const cs=caseScore(i); if(cs.graded){graded++; score+=cs.score;} });
  return {wrote, graded, score};
}

function renderTop(){
  const t = totals();
  document.getElementById("stWrote").textContent = t.wrote+"/"+CASES.length;
  document.getElementById("stScore").textContent = t.graded ? t.score+"/"+(t.graded*10) : "–";
  document.getElementById("stScoreLbl").textContent = "คะแนน ("+t.graded+" เคส)";
  document.getElementById("barFill").style.width = (t.graded/CASES.length*100)+"%";
  document.getElementById("bList").textContent = S.view==="summary" ? "รายการเคส" : "เคส "+(S.cur+1)+"/"+CASES.length;
  document.getElementById("bPrev").disabled = S.view!=="case" || S.cur===0;
  document.getElementById("bNext").textContent = S.view==="case" && S.cur===CASES.length-1 ? "สรุปคะแนน" : "ถัดไป";
  document.getElementById("bNext").disabled = S.view!=="case";
}

function renderIndex(){
  let h = `<div class="drawer-head"><b>เคสทั้งหมด</b><button class="btn ghost" id="closeNav">ปิด</button></div>`;
  for(const t in TOPICS){
    h += `<div class="grp"><h3>${TOPICS[t]}</h3><ol>`;
    CASES.forEach((c,i)=>{ if(c.topic!==t) return;
      const st = status(i), cur = S.view==="case" && S.cur===i;
      h += `<li><button data-go="${i}" aria-current="${cur}"><span class="n">${i+1}</span><span>${c.title}</span><span class="s ${st.cls}">${st.txt}</span></button></li>`;
    });
    h += `</ol></div>`;
  }
  h += `<div class="grp"><ol><li><button data-sum aria-current="${S.view==='summary'}"><span class="n">∑</span><span>สรุปคะแนน</span></button></li></ol></div>`;
  document.getElementById("index").innerHTML = h;
}

function renderBrief(){
  const i = S.cur, c = CASES[i];
  document.getElementById("colA").innerHTML = `
  <article class="panel">
    <div class="meta"><span>เคส ${i+1} จาก ${CASES.length}</span><span class="tag">${TOPICS[c.topic]}</span></div>
    <h2 class="title">${c.title}</h2>
    <dl class="client"><dt>ลูกค้า</dt><dd>${c.client}</dd><dt>ธุรกิจ</dt><dd>${c.biz}</dd><dt>เป้าหมาย</dt><dd>${c.target}</dd></dl>
    <div class="brief">${c.brief}</div>
    <div class="tasks"><h4>สิ่งที่ลูกค้าต้องการจาก FA</h4><ol>${c.tasks.map(t=>`<li>${t}</li>`).join("")}</ol></div>
    <div class="pager">
      <button class="btn ghost" data-go="${i-1}" ${i===0?"disabled":""}>เคสก่อนหน้า</button><span class="sp"></span>
      ${i===CASES.length-1 ? `<button class="btn ghost" data-sum>สรุปคะแนน</button>` : `<button class="btn ghost" data-go="${i+1}">เคสถัดไป</button>`}
    </div>
  </article>`;
}

function renderWork(){
  const i = S.cur, c = CASES[i];
  const text = S.ans[i]||"";
  const rev = !!S.rev[i];
  const g = S.grd[i]||[];
  const cs = caseScore(i);
  let stamp = "";
  if(rev && cs.graded){
    const lvl = cs.score>=8 ? "hi" : cs.score>=5 ? "md" : "lo";
    stamp = `<div class="stamp ${lvl} ${freshStamp?"fresh":""}" aria-hidden="true">${cs.score}/10</div>`;
  }
  let model = "";
  if(rev){
    const items = c.rubric.map((r,k)=>`
      <div class="ritem"><p>${r[0]}<small>${r[1]} คะแนน</small></p>
      <div class="seg" role="group" aria-label="ประเมินข้อ ${k+1}">
        ${[0,1,2].map(v=>`<button data-r="${k}" data-v="${v}" aria-pressed="${g[k]===v}">${LV[v]}</button>`).join("")}
      </div></div>`).join("");
    model = `
    <section class="model" id="model" aria-live="polite">
      <p class="lead">แนวคำตอบ</p>
      ${c.answer}
    </section>
    <section class="rubric">
      <h4>ให้คะแนนตัวเอง</h4>
      <p class="sub">เทียบคำตอบของคุณกับแต่ละประเด็น “บางส่วน” ได้ครึ่งหนึ่งของคะแนนข้อนั้น</p>
      ${items}
      <div class="total"><b>${cs.score}/10</b><span>${cs.graded ? "ประเมินครบแล้ว" : "ประเมินแล้ว "+cs.n+" จาก "+c.rubric.length+" ประเด็น"}</span>${stamp}</div>
    </section>
    <div class="acts" style="margin-top:16px">
      <button class="btn ghost" id="hideAns">ซ่อนเฉลยแล้วเขียนต่อ</button>
      <button class="btn ghost" id="clearCase">ล้างเคสนี้</button>
    </div>`;
  }
  document.getElementById("colB").innerHTML = `
  <div class="panel">
    <h4>บันทึกความเห็นของ FA</h4>
    <p class="sub">ตอบทุกข้อที่ลูกค้าถาม แสดงการคำนวณและเหตุผลประกอบ</p>
    <label for="ta" class="sub" style="position:absolute;left:-9999px">คำตอบเคส ${i+1}</label>
    <textarea id="ta" placeholder="1. ...&#10;2. ...&#10;3. ..." spellcheck="false">${esc(text)}</textarea>
    <div class="wmeta"><span id="cnt">${text.length.toLocaleString()} ตัวอักษร</span><span id="saved">${text?"บันทึกในเครื่องนี้แล้ว":""}</span></div>
    ${rev ? "" : `<div class="acts"><button class="btn primary" id="reveal">${text.trim()?"ดูแนวคำตอบและให้คะแนน":"ดูแนวคำตอบ (ยังไม่ได้เขียน)"}</button></div>`}
    ${model}
  </div>`;
  freshStamp = false;
  autosize(document.getElementById("ta"));
}

function renderSummary(){
  const t = totals();
  let rows = "";
  for(const k in TOPICS){
    const idx = CASES.map((c,i)=>i).filter(i=>CASES[i].topic===k);
    const gIdx = idx.filter(i=>caseScore(i).graded);
    const sc = gIdx.reduce((a,i)=>a+caseScore(i).score,0);
    const pct = gIdx.length ? sc/(gIdx.length*10)*100 : 0;
    rows += `<div class="row"><span>${TOPICS[k]}</span><div class="track"><span style="width:${pct}%"></span></div><b>${gIdx.length? sc+"/"+gIdx.length*10 : "ยังไม่ประเมิน"}</b></div>`;
  }
  const list = CASES.map((c,i)=>{
    const st = status(i);
    return `<tr><td><button data-go="${i}">${i+1}. ${c.title}</button></td><td>${st.txt||"ยังไม่เริ่ม"}</td></tr>`;
  }).join("");
  const weak = CASES.map((c,i)=>i).filter(i=>{const cs=caseScore(i); return cs.graded && cs.score<6;});
  document.getElementById("colA").innerHTML = `
  <article class="panel">
    <div class="meta"><span>สรุปคะแนน</span></div>
    <div class="big">${t.score}<small> / ${t.graded*10 || 0}</small></div>
    <p style="margin:0;color:var(--muted)">ประเมินแล้ว ${t.graded} จาก ${CASES.length} เคส · เต็ม 200 คะแนนเมื่อครบทุกเคส${t.graded? " · เฉลี่ย "+(t.score/t.graded).toFixed(1)+"/10":""}</p>
    <div class="rows">${rows}</div>
    ${weak.length ? `<p style="margin:0 0 6px"><b>ควรทบทวน (ต่ำกว่า 6/10):</b> ${weak.map(i=>`<button class="btn ghost" style="margin:4px 4px 0 0" data-go="${i}">เคส ${i+1}</button>`).join("")}</p>` : ""}
    <div class="tbl"><table class="clist"><thead><tr><th>เคส</th><th>สถานะ</th></tr></thead><tbody>${list}</tbody></table></div>
    <div class="acts" style="margin-top:16px"><button class="btn ghost" id="resetAll">ล้างคำตอบและคะแนนทั้งหมด</button></div>
    <p class="note" style="margin-top:16px">แนวคำตอบอ้างอิงเกณฑ์ในเอกสารประกอบการสอน BF408 ส่วนประเด็นภาษีและกฎหมายเป็นหลักทั่วไปเพื่อการฝึก ในงานจริงต้องตรวจสอบเกณฑ์ล่าสุดกับที่ปรึกษาภาษีและกฎหมาย</p>
  </article>`;
  document.getElementById("colB").innerHTML = "";
}

function render(){
  const lay = document.getElementById("layout");
  lay.classList.toggle("sum", S.view==="summary");
  document.getElementById("colB").style.display = S.view==="summary" ? "none" : "";
  renderTop(); renderIndex();
  if(S.view==="summary") renderSummary(); else { renderBrief(); renderWork(); }
}

function autosize(ta){ if(!ta) return; ta.style.height="auto"; ta.style.height=Math.max(260, ta.scrollHeight+4)+"px"; }
function smooth(){ return matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth"; }

function go(i){
  if(i<0||i>=CASES.length) return;
  S.view="case"; S.cur=i; save(); closeNav(); render();
  window.scrollTo({top:0, behavior:smooth()});
  const w = document.getElementById("colB"); if(w) w.scrollTop = 0;
}
function openSummary(){ S.view="summary"; closeNav(); render(); window.scrollTo({top:0}); }
function openNav(){ document.getElementById("index").classList.add("open"); document.getElementById("scrim").classList.add("open"); document.getElementById("menuBtn").setAttribute("aria-expanded","true"); const b=document.getElementById("closeNav"); if(b) b.focus(); }
function closeNav(){ document.getElementById("index").classList.remove("open"); document.getElementById("scrim").classList.remove("open"); document.getElementById("menuBtn").setAttribute("aria-expanded","false"); }

document.addEventListener("input", e=>{
  if(e.target.id!=="ta") return;
  const v = e.target.value; S.ans[S.cur] = v; autosize(e.target);
  document.getElementById("cnt").textContent = v.length.toLocaleString()+" ตัวอักษร";
  document.getElementById("saved").textContent = "กำลังบันทึก…";
  clearTimeout(saveTimer);
  saveTimer = setTimeout(()=>{ save(); const s=document.getElementById("saved"); if(s) s.textContent="บันทึกในเครื่องนี้แล้ว"; renderTop(); renderIndex(); const r=document.getElementById("reveal"); if(r) r.textContent = v.trim()?"ดูแนวคำตอบและให้คะแนน":"ดูแนวคำตอบ (ยังไม่ได้เขียน)"; }, 500);
});

document.addEventListener("click", e=>{
  const t = e.target;
  const g = t.closest("[data-go]"); if(g && !g.disabled){ go(+g.dataset.go); return; }
  if(t.closest("[data-sum]")){ openSummary(); return; }
  if(t.closest("#menuBtn")){ openNav(); return; }
  if(t.closest("#closeNav") || t.id==="scrim"){ closeNav(); return; }
  if(t.closest("#bList")){ openNav(); return; }
  if(t.closest("#bPrev")){ go(S.cur-1); return; }
  if(t.closest("#bNext")){ if(S.cur===CASES.length-1) openSummary(); else go(S.cur+1); return; }
  if(t.closest("#reveal")){
    S.rev[S.cur]=true; save(); renderWork(); renderIndex();
    const m = document.getElementById("model"); if(m) m.scrollIntoView({behavior:smooth(), block:"start"});
    return;
  }
  const r = t.closest("[data-r]");
  if(r){
    const k=+r.dataset.r, v=+r.dataset.v;
    const before = caseScore(S.cur).graded;
    const arr = S.grd[S.cur] || new Array(CASES[S.cur].rubric.length).fill(null);
    arr[k]=v; S.grd[S.cur]=arr; save();
    const after = caseScore(S.cur).graded;
    if(after && !before) freshStamp = true;
    const w = document.getElementById("colB"); const st = w.scrollTop, y = window.scrollY;
    renderWork(); renderIndex(); renderTop();
    w.scrollTop = st; window.scrollTo(0,y);
    const nb = document.querySelector(`[data-r="${k}"][data-v="${v}"]`); if(nb) nb.focus({preventScroll:true});
    return;
  }
  if(t.closest("#hideAns")){ S.rev[S.cur]=false; save(); renderWork(); document.getElementById("ta").focus(); return; }
  if(t.closest("#clearCase")){
    const b = t.closest("#clearCase");
    if(b.dataset.armed){ delete S.ans[S.cur]; delete S.rev[S.cur]; delete S.grd[S.cur]; save(); render(); return; }
    b.dataset.armed="1"; b.textContent="กดอีกครั้งเพื่อยืนยันการล้าง"; setTimeout(()=>{ if(b.isConnected){ delete b.dataset.armed; b.textContent="ล้างเคสนี้"; } },3000); return;
  }
  if(t.closest("#resetAll")){
    const b = t.closest("#resetAll");
    if(b.dataset.armed){ S.ans={}; S.rev={}; S.grd={}; S.cur=0; save(); render(); return; }
    b.dataset.armed="1"; b.textContent="กดอีกครั้งเพื่อยืนยัน"; setTimeout(()=>{ if(b.isConnected){ delete b.dataset.armed; b.textContent="ล้างคำตอบและคะแนนทั้งหมด"; } },3000); return;
  }
});
document.addEventListener("keydown", e=>{ if(e.key==="Escape") closeNav(); });
window.addEventListener("resize", ()=>autosize(document.getElementById("ta")));

load(); render();
</script>
</body>
</html>
